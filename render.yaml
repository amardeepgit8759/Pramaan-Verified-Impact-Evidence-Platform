# Render Blueprint: one Docker web service. The API serves the built web app from the
# same origin. The database is Neon (Postgres + pgvector), so DATABASE_URL is entered
# when the Blueprint is created; migrations run automatically when the app starts.
services:
  - type: web
    name: pramaan
    runtime: docker
    plan: free
    # Same place as the Neon database (AWS us-east-1), so every query stays in-region.
    # Render can't move a service later: match this to Neon's region before creating it.
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Neon's direct (not pooled) connection string, pasted as the console shows it
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Model ids live in configuration, not code (checked against Google's docs).
      - key: GEMINI_VISION_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_REPORT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      # Tried in order only when the model above is still over capacity after retries.
      - key: GEMINI_VISION_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-2.5-flash
      - key: GEMINI_REPORT_FALLBACK_MODELS
        value: gemini-3.7-flash,gemini-2.5-flash
      - key: TAGGING_PROVIDER
        value: cloudinary
      - key: LOG_LEVEL
        value: info
