# Full stack, like production:  docker compose up --build   -> http://localhost:3000
#   (reads credentials from .env; the database comes from the `db` service below)
# Databases only, for `pnpm dev`: pnpm db:up                 -> Postgres :55432 (+ test :55433)
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pramaan
      POSTGRES_PASSWORD: pramaan
      POSTGRES_DB: pramaan
    ports:
      - '${PRAMAAN_DB_PORT:-55432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pramaan -d pramaan']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://pramaan:pramaan@db:5432/pramaan
      NODE_ENV: production
      PORT: 8080
    ports:
      - '${PRAMAAN_APP_PORT:-3000}:8080'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Throwaway database for integration tests; data lives in memory only.
  # Started by `pnpm db:up` (naming a service enables its profile).
  db-test:
    profiles: [test]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pramaan
      POSTGRES_PASSWORD: pramaan
      POSTGRES_DB: pramaan_test
    ports:
      - '${PRAMAAN_TEST_DB_PORT:-55433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pramaan -d pramaan_test']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
