<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Pramaan verifies impact evidence for NGOs, CSR teams and funders. Every claim links back to a photo."
    />
    <meta name="theme-color" content="#f9f9fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121320" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fonts load alongside the scripts, so headings never reflow when they arrive. -->
    <link
      rel="preload"
      href="/fonts/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Social previews. The API fills in __PUBLIC_ORIGIN__ (crawlers need absolute URLs). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pramaan" />
    <meta property="og:title" content="Pramaan · Proof, not promises" />
    <meta
      property="og:description"
      content="Verified impact evidence for NGOs, CSR teams and funders. Every claim links back to a photo."
    />
    <meta property="og:image" content="__PUBLIC_ORIGIN__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pramaan: proof, not promises" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="/theme-init.js"></script>
    <title>Pramaan · Proof, not promises</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
